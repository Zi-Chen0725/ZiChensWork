<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣16張麻將 - Prototype</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --accent: #22c55e;
      --accent-2: #38bdf8;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #f9fafb;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    .container {
      width: min(1200px, 95vw);
      margin: 20px auto;
      display: grid;
      gap: 16px;
    }
    .card {
      background: rgba(17,24,39,0.92);
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    h1, h2, h3 { margin: 0 0 10px; }
    .muted { color: var(--muted); }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      align-items: end;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #d1d5db;
    }
    input, select, button {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #4b5563;
      padding: 10px 12px;
      background: #0b1220;
      color: var(--text);
      font-size: 14px;
    }
    button {
      background: linear-gradient(90deg, #2563eb, #22c55e);
      border: none;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { filter: brightness(1.08); }
    .ghost {
      background: #1f2937;
      border: 1px solid #4b5563;
    }
    .hidden { display: none !important; }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
    }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }

    .table {
      position: relative;
      background: radial-gradient(circle at center, #166534, #14532d 65%, #052e16);
      border-radius: 16px;
      min-height: 520px;
      border: 2px solid #365314;
      overflow: hidden;
      padding: 8px;
    }
    .player {
      position: absolute;
      width: 210px;
      min-height: 110px;
      background: rgba(15,23,42,0.84);
      border: 1px solid #4b5563;
      border-radius: 10px;
      padding: 10px;
    }
    .player h4 { margin: 0 0 6px; }
    .player .money { font-weight: 700; color: #fde68a; }
    .player .state { font-size: 13px; color: #cbd5e1; }
    .east { top: 12px; left: 50%; transform: translateX(-50%); }
    .south { right: 12px; top: 50%; transform: translateY(-50%); }
    .west { left: 12px; top: 50%; transform: translateY(-50%); }
    .north { bottom: 12px; left: 50%; transform: translateX(-50%); }

    .center-zone {
      position: absolute;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      text-align: center;
      width: min(90%, 420px);
      background: rgba(2,6,23,0.82);
      border: 1px dashed #a3e635;
      border-radius: 12px;
      padding: 16px;
    }
    .dice {
      font-size: 34px;
      letter-spacing: 8px;
      margin: 6px 0;
      display: inline-block;
      transition: transform .25s;
    }
    .rolling {
      animation: roll .5s linear infinite;
    }
    @keyframes roll {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .action-banner {
      position: absolute;
      bottom: 160px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 22px;
      opacity: 0;
      pointer-events: none;
      border: 2px solid rgba(255,255,255,0.5);
      text-shadow: 0 2px 8px rgba(0,0,0,.6);
    }
    .action-banner.show {
      animation: pop 1.3s ease;
    }
    @keyframes pop {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(.8); }
      20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.08); }
      70% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(1); }
    }

    .log {
      max-height: 280px;
      overflow: auto;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 8px;
      font-size: 13px;
      line-height: 1.5;
    }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #1e293b;
      margin-right: 6px;
    }
    .rules-list { margin: 0; padding-left: 18px; line-height: 1.5; }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .score-item {
      background: #0b1220;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="card" id="lobby">
      <h1>🀄 台灣16張麻將（HTML Prototype）</h1>
      <p class="muted">支援開局流程（抓位、抽風、骰子）、AI三家、自訂台數規則、圈數、底台與金額結算。此版本為單機原型，重點在規則流程與互動展示。</p>
      <div class="row">
        <div>
          <label>玩家名稱</label>
          <input id="playerName" value="玩家" />
        </div>
        <div>
          <label>花牌規則</label>
          <select id="flowerMode">
            <option value="with">有花牌（春夏秋冬梅蘭竹菊）</option>
            <option value="without">無花牌</option>
          </select>
        </div>
        <div>
          <label>底台（起胡台）</label>
          <input id="baseTai" type="number" min="0" value="1" />
        </div>
        <div>
          <label>每台金額（元）</label>
          <input id="moneyPerTai" type="number" min="1" value="10" />
        </div>
        <div>
          <label>圈數</label>
          <select id="roundCount">
            <option value="1">1圈</option>
            <option value="2" selected>2圈</option>
            <option value="4">4圈</option>
          </select>
        </div>
        <div>
          <label>每圈幾將（手）</label>
          <select id="handsPerRound">
            <option value="4" selected>4將</option>
            <option value="8">8將</option>
            <option value="16">16將</option>
          </select>
        </div>
        <div>
          <label>豹子倍率（總台數後乘）</label>
          <input id="baoMultiplier" type="number" min="1" value="2" />
        </div>
      </div>
      <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
        <button id="btnStart">開始遊戲</button>
        <button class="ghost" id="btnDemo">載入示範設定</button>
      </div>
    </section>

    <section class="layout hidden" id="gamePanel">
      <div class="card table">
        <div id="pEast" class="player east"></div>
        <div id="pSouth" class="player south"></div>
        <div id="pWest" class="player west"></div>
        <div id="pNorth" class="player north"></div>

        <div class="center-zone">
          <div><span class="pill" id="phaseTag">準備中</span><span id="windInfo">東風圈</span></div>
          <div style="margin-top:8px;" id="centerText">請按下「開始遊戲」</div>
          <div class="dice" id="diceArea">🎲 🎲</div>
          <div style="display:grid; gap:8px; margin-top:8px;" id="centerActions"></div>
        </div>

        <div id="actionBanner" class="action-banner">碰!</div>
      </div>

      <div class="card">
        <h3>規則摘要（本局使用）</h3>
        <ul class="rules-list" id="rulesView"></ul>
        <h3 style="margin-top:12px;">即時台數範例</h3>
        <div class="score-grid" id="scoreExamples"></div>
        <h3 style="margin-top:12px;">事件紀錄</h3>
        <div class="log" id="eventLog"></div>
        <div style="margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <button id="btnNextStep" class="ghost">下一步（手動）</button>
          <button id="btnAuto">自動進行</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const state = {
      settings: null,
      players: [],
      dealerIndex: 0,
      turnIndex: 0,
      currentRound: 1,
      currentHand: 1,
      totalHands: 0,
      autoTimer: null,
      stage: "lobby",
      winds: ["東", "南", "西", "北"],
      centerDeck: [],
      usedWinds: [],
      phaseQueue: [],
    };

    const el = (id) => document.getElementById(id);
    const delay = (ms) => new Promise((r) => setTimeout(r, ms));

    function log(msg) {
      const node = document.createElement("div");
      node.innerHTML = `<span class='muted'>[${new Date().toLocaleTimeString()}]</span> ${msg}`;
      el("eventLog").prepend(node);
    }

    function rollDice() {
      return Math.floor(Math.random() * 6) + 1;
    }

    function showBanner(text, color = "#38bdf8") {
      const banner = el("actionBanner");
      banner.textContent = text;
      banner.style.background = color;
      banner.classList.remove("show");
      void banner.offsetWidth;
      banner.classList.add("show");
    }

    function renderPlayers() {
      state.players.forEach((p, i) => {
        const posMap = ["East", "South", "West", "North"];
        const box = el(`p${posMap[i]}`);
        box.innerHTML = `
          <h4>${state.winds[i]}位｜${p.name}</h4>
          <div class="state">${p.isHuman ? "真人" : "AI Bot"}｜${p.status || "待機"}</div>
          <div class="state">手牌: ${p.handCount} 張</div>
          <div class="money">$${p.money.toLocaleString()}</div>
        `;
      });
    }

    function buildRules() {
      const s = state.settings;
      const rules = [
        `玩法：台灣16張麻將，${s.flowerMode === "with" ? "啟用花牌" : "不使用花牌"}`,
        `起胡底台：${s.baseTai} 台；每台 ${s.moneyPerTai} 元`,
        `全紅：+1 台（你指定）`,
        `骰龜：+2 台（你指定）`,
        `豹子：總台數計算後 × ${s.baoMultiplier} 倍（你指定）`,
        "開場流程：隨機一位玩家先骰決定抓位起點，再進行抽風排位",
        "若先骰者是真人玩家：由玩家手動決定抓位骰與抽風；AI自動操作",
        `總局數：${s.roundCount} 圈 × ${s.handsPerRound} 將 = ${state.totalHands} 將`,
        "胡牌/碰/吃/槓目前為流程原型（動畫+隨機事件），可再擴充完整牌理判斷"
      ];
      el("rulesView").innerHTML = rules.map(r => `<li>${r}</li>`).join("");

      const examples = [
        { name: "平胡", tai: s.baseTai + 1, note: "假設門清+自摸" },
        { name: "全紅", tai: s.baseTai + 1 + 1, note: "平胡 + 全紅" },
        { name: "骰龜", tai: s.baseTai + 1 + 2, note: "平胡 + 骰龜" },
        { name: "豹子", tai: (s.baseTai + 2) * s.baoMultiplier, note: "結算後再乘倍率" },
      ];
      el("scoreExamples").innerHTML = examples.map(e => `
        <div class="score-item">
          <strong>${e.name}</strong><br/>
          台數：${e.tai} 台<br/>
          <span class="muted">${e.note}</span>
        </div>`).join("");
    }

    function getSettings() {
      return {
        playerName: el("playerName").value.trim() || "玩家",
        flowerMode: el("flowerMode").value,
        baseTai: Math.max(0, Number(el("baseTai").value || 0)),
        moneyPerTai: Math.max(1, Number(el("moneyPerTai").value || 1)),
        roundCount: Number(el("roundCount").value),
        handsPerRound: Number(el("handsPerRound").value),
        baoMultiplier: Math.max(1, Number(el("baoMultiplier").value || 1)),
      };
    }

    function setupPlayers(name) {
      const list = [
        { name, isHuman: true },
        { name: "AI-阿發", isHuman: false },
        { name: "AI-美玲", isHuman: false },
        { name: "AI-大熊", isHuman: false },
      ];
      return list.sort(() => Math.random() - 0.5).map(p => ({
        ...p,
        money: 0,
        handCount: 16,
        status: "等待開局",
      }));
    }

    async function animateDice(times = 8, ms = 90) {
      const dice = el("diceArea");
      dice.classList.add("rolling");
      for (let i = 0; i < times; i++) {
        dice.textContent = `${rollDice()} + ${rollDice()}`;
        await delay(ms);
      }
      const d1 = rollDice(), d2 = rollDice();
      dice.textContent = `${d1} + ${d2}`;
      dice.classList.remove("rolling");
      return { d1, d2, sum: d1 + d2 };
    }

    function setCenter(text, tag) {
      el("centerText").innerHTML = text;
      if (tag) el("phaseTag").textContent = tag;
    }

    function setCenterActions(actions = []) {
      const zone = el("centerActions");
      zone.innerHTML = "";
      actions.forEach(a => {
        const b = document.createElement("button");
        b.textContent = a.label;
        b.className = a.ghost ? "ghost" : "";
        b.onclick = a.onClick;
        zone.appendChild(b);
      });
    }

    async function openingFlow() {
      state.stage = "opening";
      setCenter("四位玩家隨機選一位先骰，決定抓位起點。", "開場流程");
      setCenterActions([]);

      await delay(600);
      const starter = Math.floor(Math.random() * 4);
      state.dealerIndex = starter;
      const p = state.players[starter];
      log(`🎯 ${p.name} 被選為先骰者。`);

      if (p.isHuman) {
        setCenter(`你是先骰者，請按下按鈕執行抓位骰。`, "玩家操作");
        await new Promise(resolve => {
          setCenterActions([
            {
              label: "我來骰抓位",
              onClick: async () => {
                const rs = await animateDice();
                log(`🎲 玩家抓位骰：${rs.d1}+${rs.d2}=${rs.sum}`);
                setCenterActions([]);
                resolve();
              }
            }
          ]);
        });
      } else {
        setCenter(`${p.name}（AI）正在骰抓位...`, "AI操作");
        const rs = await animateDice();
        log(`🤖 ${p.name} 抓位骰：${rs.d1}+${rs.d2}=${rs.sum}`);
      }

      await delay(400);
      await drawWinds(p.isHuman);
      await delay(400);
      initializePhaseQueue();
      renderPlayers();
      nextPhase();
    }

    async function drawWinds(humanStarter) {
      setCenter("開始抽風牌（東南西北）決定位子。", "抽風定位");
      const deck = [...state.winds].sort(() => Math.random() - 0.5);
      state.centerDeck = deck;
      state.usedWinds = [];
      log(`🀄 風牌已洗好：${deck.join("、")}（僅示範）`);

      for (const pl of state.players) {
        if (pl.isHuman && humanStarter) {
          await new Promise(resolve => {
            setCenter(`${pl.name} 請抽風牌決定位子。`, "玩家抽風");
            setCenterActions([{ label: "抽一張風牌", onClick: () => {
              const wind = state.centerDeck.shift();
              state.usedWinds.push(wind);
              pl.wind = wind;
              log(`🙋 ${pl.name} 抽到 ${wind}風。`);
              setCenterActions([]);
              resolve();
            }}]);
          });
        } else {
          await delay(300);
          const wind = state.centerDeck.shift();
          state.usedWinds.push(wind);
          pl.wind = wind;
          log(`${pl.isHuman ? "🙋" : "🤖"} ${pl.name} 抽到 ${wind}風。`);
        }
      }

      state.players.sort((a, b) => state.winds.indexOf(a.wind) - state.winds.indexOf(b.wind));
      state.turnIndex = 0;
      const dealer = state.players[0];
      dealer.status = "莊家";
      log(`👑 ${dealer.name}（東家）成為第一將莊家。`);
      el("windInfo").textContent = `第 ${state.currentRound} 圈 / 第 ${state.currentHand} 將`;
      renderPlayers();
    }

    function initializePhaseQueue() {
      state.phaseQueue = [
        "draw", "discard", "reaction", "draw", "discard", "reaction", "draw", "discard", "reaction", "settle"
      ];
    }

    function randomAction() {
      const r = Math.random();
      if (r < 0.52) return "過";
      if (r < 0.67) return "吃";
      if (r < 0.82) return "碰";
      if (r < 0.92) return "槓";
      return "胡";
    }

    function calcTai(action) {
      const s = state.settings;
      let tai = s.baseTai + 1;
      if (Math.random() < 0.16) tai += 1; // 全紅
      if (Math.random() < 0.12) tai += 2; // 骰龜
      if (action === "槓") tai += 1;
      if (action === "胡" && Math.random() < 0.2) tai *= s.baoMultiplier;
      return tai;
    }

    function settleHand(winnerIdx) {
      const winner = state.players[winnerIdx];
      const tai = calcTai("胡");
      const amount = tai * state.settings.moneyPerTai;
      winner.money += amount * 3;
      state.players.forEach((p, idx) => {
        if (idx !== winnerIdx) p.money -= amount;
      });
      showBanner(`胡牌 ${tai}台 +$${amount*3}`, "#f59e0b");
      log(`🏁 ${winner.name} 胡牌，${tai}台，每家付 ${amount} 元。`);
      renderPlayers();
    }

    function advanceHand() {
      state.currentHand += 1;
      if (state.currentHand > state.settings.handsPerRound) {
        state.currentRound += 1;
        state.currentHand = 1;
      }
      if (state.currentRound > state.settings.roundCount) {
        endGame();
        return false;
      }
      state.players.forEach(p => { p.handCount = 16; p.status = "新局準備"; });
      state.turnIndex = (state.turnIndex + 1) % 4;
      initializePhaseQueue();
      el("windInfo").textContent = `第 ${state.currentRound} 圈 / 第 ${state.currentHand} 將`;
      log(`🔄 進入第 ${state.currentRound} 圈第 ${state.currentHand} 將`);
      renderPlayers();
      return true;
    }

    function endGame() {
      state.stage = "ended";
      setCenter("遊戲結束，請查看最終結算。", "結算");
      setCenterActions([{ label: "回到大廳", onClick: resetGame }]);
      const rank = [...state.players].sort((a,b)=>b.money-a.money)
        .map((p, i) => `${i+1}. ${p.name}：$${p.money.toLocaleString()}`)
        .join("<br/>");
      log(`💰 最終排名：<br/>${rank}`);
      showBanner("全場結算", "#8b5cf6");
    }

    function nextPhase() {
      if (state.stage === "ended") return;
      if (!state.phaseQueue.length) {
        if (advanceHand()) nextPhase();
        return;
      }

      const phase = state.phaseQueue.shift();
      const current = state.players[state.turnIndex];

      if (phase === "draw") {
        current.handCount += 1;
        current.status = "摸牌中";
        log(`🃏 ${current.name} 摸牌。`);
        renderPlayers();
        setCenter(`${current.name} 摸牌`, "進行中");
      } else if (phase === "discard") {
        current.handCount -= 1;
        current.status = "打出一張牌";
        log(`🗑️ ${current.name} 打出一張牌。`);
        renderPlayers();
        setCenter(`${current.name} 打牌`, "進行中");
      } else if (phase === "reaction") {
        const candidates = state.players.filter((_, i) => i !== state.turnIndex);
        const reactor = candidates[Math.floor(Math.random() * candidates.length)];
        const action = randomAction();
        if (action === "過") {
          log(`⏭️ 其他玩家都選擇過。`);
        } else {
          const colorMap = { "吃": "#38bdf8", "碰": "#f97316", "槓": "#ef4444", "胡": "#facc15" };
          showBanner(`${action}!`, colorMap[action]);
          log(`${reactor.isHuman ? "🙋" : "🤖"} ${reactor.name} 宣告「${action}」`);
          if (action === "胡") {
            settleHand(state.players.indexOf(reactor));
            state.phaseQueue = [];
          }
        }
        setCenter(`反應階段：${action}`, "吃碰槓胡");
        state.turnIndex = (state.turnIndex + 1) % 4;
      } else if (phase === "settle") {
        if (Math.random() < 0.4) {
          const winner = Math.floor(Math.random() * 4);
          settleHand(winner);
        } else {
          log("🟰 本將流局，無人胡牌。");
          showBanner("流局", "#6b7280");
        }
      }
    }

    function startAuto() {
      if (state.autoTimer) clearInterval(state.autoTimer);
      state.autoTimer = setInterval(() => {
        if (state.stage === "ended") {
          clearInterval(state.autoTimer);
          return;
        }
        nextPhase();
      }, 1300);
      log("▶️ 自動進行已啟動。")
    }

    function resetGame() {
      state.stage = "lobby";
      clearInterval(state.autoTimer);
      state.autoTimer = null;
      el("gamePanel").classList.add("hidden");
      el("lobby").classList.remove("hidden");
      el("eventLog").innerHTML = "";
      setCenterActions([]);
    }

    async function startGame() {
      state.settings = getSettings();
      state.totalHands = state.settings.roundCount * state.settings.handsPerRound;
      state.currentRound = 1;
      state.currentHand = 1;
      state.players = setupPlayers(state.settings.playerName);
      el("lobby").classList.add("hidden");
      el("gamePanel").classList.remove("hidden");
      buildRules();
      renderPlayers();
      log("🎮 新局建立完成，所有玩家初始金額為 0 元。")
      await openingFlow();
    }

    el("btnStart").addEventListener("click", startGame);
    el("btnDemo").addEventListener("click", () => {
      el("playerName").value = "小陳";
      el("flowerMode").value = "with";
      el("baseTai").value = 1;
      el("moneyPerTai").value = 20;
      el("roundCount").value = 2;
      el("handsPerRound").value = 4;
      el("baoMultiplier").value = 3;
      log("🧪 已載入示範設定，可直接開始。");
    });
    el("btnNextStep").addEventListener("click", nextPhase);
    el("btnAuto").addEventListener("click", startAuto);
  </script>
</body>
</html>
